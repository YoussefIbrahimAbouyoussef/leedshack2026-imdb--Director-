<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMDb Style Mock</title>
    <link rel="stylesheet" href="IMDB.css" />
  </head>

  <body>
    <header class="imdb-header">
      <div class="container header-inner">
        <div class="left">
          <div class="imdb-logo">IMDb</div>
          <span class="cast-label">Cast</span>
        </div>

        <div class="right">
          <span class="signin">Sign in</span>
          <button class="lang">EN</button>
        </div>
      </div>
    </header>

    <main class="hero">
      <div class="upload-card">
        <div class="upload-pill">
          <span>Please upload script here</span>
          <span class="plus">+</span>
        </div>
      </div>
    </main>

    <section class="cast-section">
      <div class="container">
        <div class="cast-header">
          <span>Explore</span>

          <div class="search">
            <input id="searchInput" type="text" placeholder="Explore" />
            <span class="icon">🔍</span>
          </div>

          <span class="see-all">See All</span>
        </div>

        <!-- ✅ THIS is the ONLY results row (start empty; JS fills it) -->
        <div class="cast-row" id="results"></div>
      </div>
    </section>

    <script src="Frontpage.js"></script>
  </body>
</html>
